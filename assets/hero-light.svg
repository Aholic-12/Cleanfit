<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Cleanfit — 深度视觉人体身形测量与版型适配">
  <title>Cleanfit · Deep Vision Body Measurement &amp; Fit Adaptation</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F4FF"/>
    </linearGradient>

    <!-- 顶部流光：靠 gradientTransform 平移制造流动感 -->
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="30%" stop-color="#FFB400"/>
      <stop offset="55%" stop-color="#FF6B6B"/>
      <stop offset="80%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#FFB400"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 0 0; -1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- 扫描光带 -->
    <linearGradient id="scanGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0"/>
      <stop offset="70%" stop-color="#6C63FF" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0"/>
    </linearGradient>

    <!-- 扫描线本体：两端淡出，避免像一块硬边矩形 -->
    <linearGradient id="scanEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#6C63FF" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#6C63FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0"/>
    </linearGradient>

    <!-- 横向淡出遮罩，让光带左右边缘不硬 -->
    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="22%" stop-color="#fff"/>
      <stop offset="78%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <mask id="scanMask">
      <rect x="770" y="0" width="380" height="46" fill="url(#fadeX)"/>
    </mask>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#flow)"/>

  <!-- 顶部小标签 -->
  <text x="72" y="88" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700"
        letter-spacing="5" fill="#FFB400">DEEP VISION FITTING SYSTEM</text>

  <!-- 主标题 -->
  <text x="70" y="180" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="92" font-weight="800"
        letter-spacing="-1" fill="#0E0E17">Cleanfit<tspan fill="#6C63FF" fill-opacity="1">.
        <animate attributeName="fill-opacity" values="1;0.1;1" dur="2.4s"
                 repeatCount="indefinite"/></tspan></text>

  <!-- 中文副标题 -->
  <text x="74" y="228" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="600"
        fill="#0E0E17" fill-opacity="0.88">深度视觉 · 人体身形测量与版型适配</text>

  <!-- 英文说明 -->
  <text x="74" y="264" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500"
        letter-spacing="2.6" fill="#5A5A72">MEASURE PRECISELY — DRESS WITH CONFIDENCE</text>

  <!-- 右侧：人体比例测量示意（带扫描动效） -->
  <g>
    <line x1="930" y1="74" x2="930" y2="296" stroke="#6C63FF" stroke-opacity="0.28"
