      <animate attributeName="stroke-dashoffset" from="30" to="0"
               dur="0.9s" begin="0.0s" fill="freeze"/>
    </line>
    <circle cx="915.0" cy="96" r="3.2" fill="#FFB400">
      <animate attributeName="r" values="2.6;4.6;2.6" dur="2.6s"
