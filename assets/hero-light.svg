      fill="#6C63FF" fill-opacity="0.8">HIP<animate attributeName="fill-opacity"
      from="0" to="0.8" dur="0.6s" begin="2.2s" fill="freeze"/></text>
  </g>

  <!-- 扫描线：上下往复 -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate"
                      values="0 40; 0 210; 0 40" dur="7s" repeatCount="indefinite"
                      calcMode="spline" keyTimes="0;0.5;1"
                      keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <rect x="770" y="0" width="380" height="46" fill="url(#scanGlow)" mask="url(#scanMask)"/>
    <rect x="770" y="44" width="380" height="1.6" fill="url(#scanEdge)">
      <animate attributeName="opacity" values="0.95;0.35;0.95" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

